[package]
name = "aurona_code"
version = "0.4.5"
description = "Aurona Code Preview"
authors = ["Aurona Team"]
edition = "2021"

[lib]
name = "aurona_code_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[profile.release]
codegen-units = 1
lto = true
# 运行时性能优先于二进制体积：编辑器内核（rope/regex/wasmtime JIT）对 opt 级别敏感
opt-level = 3
strip = true
panic = "abort"

# 开发模式也保证依赖的运行时性能：性能基准、wasmtime JIT、搜索在 tauri:dev 下不失真
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[build-dependencies]
dotenvy = "0.15"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
serde = { version = "1.0", features = ["derive"] }
portable-pty = "0.9.0"
ignore = "0.4.26"
regex = "1.12.4"
serde_json = "1.0"
tokio = { version = "1.36", features = ["full"] }
base64 = "0.22.1"
dashmap = "6.2.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2.5.4"
ts-rs = "8.1"
ropey = "1.6"
"arc-swap" = "1.7"
sysinfo = "0.32"
url = "2.5"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "native-tls"] }
sha2 = "0.10.9"
rand = "0.9.2"
subtle = "2.6.1"
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["rust_crypto", "use_pem"] }
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }
notify = "8"
crc32fast = "1.4"
wasmtime = "47.0.3"
wasmtime-wasi = "47.0.3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", rev = "c4c45d503ea115a839aae718d02f79e7c7f0f673" }

[dev-dependencies]
rsa = { version = "0.9.10", features = ["pem"] }
rand08 = { package = "rand", version = "0.8.5" }

[features]
devtools = []
aurona-account = []
