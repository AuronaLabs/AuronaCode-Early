<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'none';" />
  <title>Aurona Planner</title>
  <style>
    :root, :root[data-theme="light"] {
      --bg: transparent;
      --fg: #0f172a;
      --muted: #64748b;
      --card-bg: rgba(0, 0, 0, 0.025);
      --card-border: rgba(0, 0, 0, 0.06);
      --card-hover: rgba(0, 0, 0, 0.05);
      --stat-bg: rgba(0, 0, 0, 0.02);
      --accent: #0284c7;
      --accent-glow: rgba(2, 132, 199, 0.12);
      --accent-done: #16a34a;
      --accent-pending: #d97706;
      --progress-bg: rgba(0, 0, 0, 0.06);
      --radius: 12px;
      --badge-cat: rgba(0, 0, 0, 0.05);
    }
    :root[data-theme="dark"] {
      --bg: transparent;
      --fg: #e6edf3;
      --muted: #8b949e;
      --card-bg: rgba(255, 255, 255, 0.035);
      --card-border: rgba(255, 255, 255, 0.07);
      --card-hover: rgba(255, 255, 255, 0.06);
      --stat-bg: rgba(255, 255, 255, 0.025);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --accent-done: #4ade80;
      --accent-pending: #fbbf24;
      --progress-bg: rgba(255, 255, 255, 0.06);
      --badge-cat: rgba(255, 255, 255, 0.07);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      min-height: 100%;
      position: relative;
      background: transparent !important;
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      user-select: none;
    }
    body {
      padding: 10px;
    }
    .planner-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 100%;
    }
    .planner-header {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 10px 12px;
      backdrop-filter: blur(16px);
      transition: all 0.2s ease;
    }
    .planner-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .planner-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .progress-badge {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-glow);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 1.5px 7px;
      border-radius: 999px;
    }
    .planner-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }
    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 5px 4px;
      border-radius: 8px;
      background: var(--stat-bg);
      border: 1px solid var(--card-border);
      transition: all 0.2s ease;
    }
    .stat-num {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }
    .stat-label {
      font-size: 9.5px;
      color: var(--muted);
      margin-top: 1px;
    }
    .stat-done .stat-num {
      color: var(--accent-done);
    }
    .stat-pending .stat-num {
      color: var(--accent-pending);
    }
    .progress-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .progress-track {
      flex: 1;
      height: 5px;
      background: var(--progress-bg);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-done));
      border-radius: 999px;
      transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .planner-empty-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 260px;
    }
    .planner-empty {
      width: 100%;
      padding: 24px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--card-bg);
      border: 1px dashed var(--card-border);
      border-radius: var(--radius);
    }
    .empty-icon-svg {
      width: 32px;
      height: 32px;
      stroke: var(--muted);
      opacity: 0.55;
      margin-bottom: 8px;
    }
    .empty-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--fg);
      opacity: 0.9;
      margin-bottom: 4px;
      text-align: center;
    }
    .empty-text {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.6;
      max-width: 220px;
      text-align: center;
      margin: 0 auto;
    }
    .empty-text code {
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 10.5px;
      padding: 1px 4px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 4px;
    }
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .task-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 7px 9px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }
    .task-item:hover {
      background: var(--card-hover);
      border-color: rgba(128, 128, 128, 0.2);
      transform: translateY(-1px);
    }
    .task-checkbox-mock {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 15px;
      height: 15px;
      margin-top: 1.5px;
      border-radius: 4px;
      border: 1.25px solid var(--muted);
      color: white;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }
    .task-item.completed .task-checkbox-mock {
      background: var(--accent-done);
      border-color: var(--accent-done);
    }
    .task-checkbox-mock svg {
      width: 10px;
      height: 10px;
      stroke: currentColor;
    }
    .task-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .task-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .task-title {
      font-size: 12px;
      font-weight: 500;
      color: var(--fg);
      word-break: break-word;
      line-height: 1.35;
      transition: all 0.15s ease;
    }
    .task-item.completed .task-title {
      text-decoration: line-through;
      color: var(--muted);
      opacity: 0.75;
    }
    .task-category-pill {
      font-size: 9.5px;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--badge-cat);
      color: var(--muted);
      white-space: nowrap;
      border: 1px solid var(--card-border);
    }
  </style>
</head>
