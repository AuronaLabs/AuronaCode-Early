[package]
name = "aurona-planner"
version = "0.1.0"
description = "Aurona Task & Test Planner extension (WASM component guest)"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.58"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
