<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
  />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Markdown Preview</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1e293b;
      --muted: #64748b;
      --border: rgba(0, 0, 0, 0.08);
      --border-subtle: rgba(0, 0, 0, 0.04);
      --code-bg: rgba(0, 0, 0, 0.04);
      --pre-bg: #f8fafc;
      --pre-header-bg: rgba(0, 0, 0, 0.025);
      --quote-bg: rgba(37, 99, 235, 0.04);
      --quote-border: #3b82f6;
      --accent: #2563eb;
      --table-hover: rgba(0, 0, 0, 0.02);
      --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.04);
      --status-bg: rgba(255, 255, 255, 0.92);
      --dot-red: #ff5f56;
      --dot-yellow: #ffbd2e;
      --dot-green: #27c93f;
    }
    :root[data-theme="dark"] {
      --bg: #13161d;
      --fg: #e2e8f0;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --border-subtle: rgba(255, 255, 255, 0.04);
      --code-bg: rgba(255, 255, 255, 0.06);
      --pre-bg: #161922;
      --pre-header-bg: rgba(255, 255, 255, 0.03);
      --quote-bg: rgba(96, 165, 250, 0.06);
      --quote-border: #60a5fa;
      --accent: #60a5fa;
      --table-hover: rgba(255, 255, 255, 0.03);
      --card-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      --status-bg: rgba(19, 22, 29, 0.92);
      --dot-red: rgba(255, 95, 86, 0.85);
      --dot-yellow: rgba(255, 189, 46, 0.85);
      --dot-green: rgba(39, 201, 63, 0.85);
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      min-height: 100%;
      position: relative;
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow-wrap: break-word;
      user-select: text;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(128, 128, 128, 0.24);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(128, 128, 128, 0.42);
    }
    #preview {
      padding: 12px 14px 20px;
      min-height: 100%;
      box-sizing: border-box;
    }
    #preview:empty {
      display: none;
    }
    #preview > :first-child {
      margin-top: 0 !important;
    }
    #preview > :last-child {
      margin-bottom: 0 !important;
    }
    #preview h1, #preview h2, #preview h3, #preview h4, #preview h5, #preview h6 {
      line-height: 1.35;
      letter-spacing: -0.015em;
      color: var(--fg);
    }
    #preview h1 {
      font-size: 1.35em;
      font-weight: 700;
      margin: 1.1em 0 0.5em;
      padding-bottom: 0.35em;
      border-bottom: 1px solid var(--border);
    }
    #preview h2 {
      position: relative;
      font-size: 1.18em;
      font-weight: 650;
      margin: 1.05em 0 0.45em;
      padding-left: 9px;
    }
    #preview h2::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.2em;
      bottom: 0.2em;
      width: 3.5px;
      border-radius: 4px;
      background: var(--accent);
    }
    #preview h3 {
      font-size: 1.06em;
      font-weight: 600;
      margin: 0.9em 0 0.4em;
    }
    #preview h4 {
      font-size: 1em;
      font-weight: 600;
      margin: 0.8em 0 0.35em;
    }
    #preview p {
      margin: 0.65em 0;
    }
    #preview ul, #preview ol {
      margin: 0.65em 0;
      padding-left: 1.5em;
    }
    #preview li {
      margin: 0.25em 0;
    }
    #preview li > p {
      margin: 0.15em 0;
    }
    #preview blockquote {
      margin: 0.8em 0;
      padding: 6px 12px 6px 13px;
      border-left: 3.5px solid var(--quote-border);
      background: var(--quote-bg);
      border-radius: 0 8px 8px 0;
      color: var(--muted);
    }
    #preview blockquote > :first-child { margin-top: 0; }
    #preview blockquote > :last-child { margin-bottom: 0; }
    #preview code {
      padding: 0.15em 0.42em;
      border-radius: 5px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      font: 11.8px/1.5 "JetBrains Mono", "Cascadia Code", Consolas, Menlo, monospace;
    }
    #preview pre {
      position: relative;
      margin: 0.85em 0;
      padding-top: 24px;
      border-radius: 10px;
      background: var(--pre-bg);
      border: 1px solid var(--border);
      box-shadow: var(--card-shadow);
      overflow: hidden;
    }
    #preview pre::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 22px;
      background: var(--pre-header-bg);
      border-bottom: 1px solid var(--border-subtle);
      background-image: 
        radial-gradient(circle at 12px 11px, var(--dot-red) 3.5px, transparent 4px),
        radial-gradient(circle at 22px 11px, var(--dot-yellow) 3.5px, transparent 4px),
        radial-gradient(circle at 32px 11px, var(--dot-green) 3.5px, transparent 4px);
    }
    #preview pre code {
      display: block;
      padding: 10px 14px;
      background: transparent;
      border: none;
      font-size: 11.8px;
      line-height: 1.6;
      overflow-x: auto;
    }
    #preview table {
      border-collapse: separate;
      border-spacing: 0;
      margin: 0.85em 0;
      width: 100%;
      max-width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: block;
      overflow-x: auto;
      box-shadow: var(--card-shadow);
    }
    #preview th, #preview td {
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 6px 11px;
      text-align: left;
      font-size: 12px;
    }
    #preview th:last-child, #preview td:last-child {
      border-right: none;
    }
    #preview tr:last-child td {
      border-bottom: none;
    }
    #preview th {
      background: var(--code-bg);
      font-weight: 600;
      color: var(--fg);
    }
    #preview tr:hover td {
      background: var(--table-hover);
    }
    #preview kbd {
      display: inline-block;
      padding: 0.15em 0.42em;
      font-size: 11px;
      line-height: 1.4;
      color: var(--fg);
      background: var(--pre-bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      box-shadow: 0 1px 0 var(--border);
      font-family: inherit;
    }
    #preview a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s ease;
    }
    #preview a:hover {
      border-bottom-color: var(--accent);
    }
    #preview hr {
      border: none;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border) 20%, var(--border) 80%, transparent);
      margin: 1.2em 0;
    }
    #preview img {
      max-width: 100%;
      border-radius: 8px;
      box-shadow: var(--card-shadow);
    }
    #preview del {
      opacity: 0.6;
    }
    #empty {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      box-sizing: border-box;
    }
    #preview:empty ~ #empty {
      display: flex;
    }
    #empty svg {
      width: 40px;
      height: 40px;
      stroke: var(--muted);
      opacity: 0.55;
      margin-bottom: 10px;
    }
    #empty .title {
      font-size: 13px;
      font-weight: 600;
      color: var(--fg);
      opacity: 0.9;
      margin-bottom: 6px;
      text-align: center;
    }
    #empty .desc {
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.5;
      max-width: 230px;
      text-align: center;
    }
    #status {
      position: sticky;
      bottom: 6px;
      margin: 6px 12px 4px;
      display: none;
      padding: 4px 10px;
      font-size: 11px;
      color: var(--muted);
      background: var(--status-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: var(--card-shadow);
      text-align: center;
    }
    #status:not(:empty) {
      display: block;
    }
  </style>
</head>
<body>
  <article id="preview"><!--AURONA_RENDER_SLOT--></article>
  <div id="empty">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
      <path d="M14 3v5h5" />
      <path d="M9 13l1.5 1.5L12 13l1.5 1.5L15 13" />
      <path d="M9 17h6" />
    </svg>
    <div class="title">Markdown 实时预览</div>
    <div class="desc">在右侧编辑器中打开或编辑 Markdown 文档即可在此实时查看渲染效果</div>
  </div>
  <div id="status"><!--AURONA_STATUS_SLOT--></div>
</body>
</html>
