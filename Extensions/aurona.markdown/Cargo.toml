[package]
name = "aurona-markdown"
version = "0.1.0"
description = "Aurona Markdown Preview extension (WASM component guest)"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.58"
pulldown-cmark = "0.13.4"
ammonia = "4.1.4"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
