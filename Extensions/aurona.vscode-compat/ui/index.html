<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'none';" />
  <title>Aurona VSCode Compat</title>
  <style>
    :root, :root[data-theme="light"] {
      --bg: #ffffff;
      --fg: #0f172a;
      --muted: #64748b;
      --card-bg: rgba(0, 0, 0, 0.03);
      --card-border: rgba(0, 0, 0, 0.07);
      --card-hover: rgba(0, 0, 0, 0.05);
      --stat-bg: rgba(0, 0, 0, 0.025);
      --accent: #0284c7;
      --accent-glow: rgba(2, 132, 199, 0.15);
      --terminal-bg: #0f172a;
      --terminal-fg: #38bdf8;
      --radius: 12px;
    }
    :root[data-theme="dark"] {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #8b949e;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(255, 255, 255, 0.07);
      --stat-bg: rgba(255, 255, 255, 0.03);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --terminal-bg: #050811;
      --terminal-fg: #7dd3fc;
      --radius: 12px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      min-height: 100%;
      position: relative;
      background: transparent;
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      user-select: none;
    }
    body {
      padding: 12px;
    }
    .compat-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 100%;
    }
    .compat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 12px;
      backdrop-filter: blur(12px);
    }
    .header-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .header-icon {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: var(--accent-glow);
      color: var(--accent);
      flex-shrink: 0;
    }
    .header-icon svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
    }
    .compat-title {
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }
    .compat-subtitle {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .compat-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px;
      border-radius: 8px;
      background: var(--stat-bg);
      border: 1px solid var(--card-border);
    }
    .stat-num {
      font-size: 12.5px;
      font-weight: 700;
      line-height: 1.2;
      color: var(--accent);
    }
    .stat-label {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }
    .card-section-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .card-section-title svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
    }
    .commands-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .command-item {
      display: flex;
      flex-direction: column;
      padding: 8px 10px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      transition: all 0.15s ease;
    }
    .command-item:hover {
      background: var(--card-hover);
      border-color: rgba(128, 128, 128, 0.2);
    }
    .command-title {
      font-size: 12px;
      font-weight: 500;
    }
    .command-id code {
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 10.5px;
      color: var(--accent);
      opacity: 0.85;
    }
    .log-terminal {
      background: var(--terminal-bg);
      border: 1px solid rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      padding: 8px 10px;
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 11px;
      line-height: 1.6;
      max-height: 180px;
      overflow-y: auto;
    }
    .log-line {
      display: flex;
      gap: 6px;
      word-break: break-all;
    }
    .log-prefix {
      color: var(--muted);
      user-select: none;
    }
    .log-text {
      color: var(--terminal-fg);
    }
  </style>
</head>
<body>

</body>
</html>
