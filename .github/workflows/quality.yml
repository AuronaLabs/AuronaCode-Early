name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run check
      - run: pnpm run check:boundaries
      - run: pnpm run check:materials
      - run: pnpm run verify:vscode-compat
      - run: pnpm run smoke
      - run: pnpm run test:frontend
      - run: pnpm run build

  extension:
    name: Built-in extension (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
        # 扩展使用 wasm32-wasip2 target 编译
      - run: rustup target add wasm32-wasip2
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./Extensions/aurona.vscode-compat
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run prepare:extensions
      - name: Verify extension integrity and package contract
        run: |
          pnpm run verify:vscode-compat

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Windows runner 首次冷编译 wasmtime 并保存缓存可达 45 分钟以上（缓存命中后仅数分钟），
    # 预留冷启动余量，避免超时导致缓存无法保存、陷入每次全量编译的循环。
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      # Windows 用 actions/cache：rust-cache 的保存 key 固定基于 Cargo.lock 哈希，
      # 被取消的 run 与新 run 的 post-save 同 key 并发会互相顶掉
      # （"Unable to reserve cache with key ..., another job may be creating this cache"），
      # 导致 Windows 反复 40+ 分钟冷编译。改为 run_id 唯一保存 key + restore-keys 前缀共享，
      # save-always 保证失败/取消也能落盘。Linux/macOS 保存快、几乎不冲突，保留 rust-cache。
      - name: Restore Rust cache (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: quality-rust-windows-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            quality-rust-windows-${{ hashFiles('src-tauri/Cargo.lock') }}-
            quality-rust-windows-
          save-always: true
      - uses: swatinem/rust-cache@v2
        if: runner.os != 'Windows'
        with:
          workspaces: ./src-tauri
          prefix-key: quality
          # 即使任务失败也保存缓存，避免一次超时让后续每次都被迫冷编译
          cache-on-failure: true
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
