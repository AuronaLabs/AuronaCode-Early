name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.3.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate tag format
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release metadata
        run: pnpm run smoke

      - name: Verify source quality
        run: |
          pnpm run prepare:extensions
          pnpm run typecheck
          pnpm run check
          pnpm run check:boundaries
          pnpm run check:materials
          pnpm run test:frontend
          pnpm run build

      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v$PACKAGE_VERSION" && "$RELEASE_TAG" != "v$PACKAGE_VERSION"-* ]]; then
            echo "Tag $RELEASE_TAG does not match package version v$PACKAGE_VERSION"
            exit 1
          fi

  release:
    name: Build (${{ matrix.settings.platform }})
    needs: preflight
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: macos-latest
            args: --target universal-apple-darwin
            target: universal-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: --bundles nsis
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.settings.platform }}
    timeout-minutes: 90
    env:
      TAURI_ENV_TARGET_TRIPLE: ${{ matrix.settings.target }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin,wasm32-wasip2' || 'wasm32-wasip2' }}

      - name: Ensure wasm target is installed
        run: rustup target add wasm32-wasip2

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
          pkg-config --modversion gdk-3.0

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch Cargo dependencies
        working-directory: src-tauri
        run: cargo fetch --locked

      - name: Extract changelog
        run: pnpm exec vite-node scripts/extract-changelog.ts
        env:
          GITHUB_REF_NAME: ${{ env.RELEASE_TAG }}

      - name: Detect release channel
        shell: bash
        run: |
          if [[ "${{ env.RELEASE_TAG }}" =~ -pioneer\. ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
            echo "AURONA_CHANNEL=pioneer" >> "$GITHUB_ENV"
            echo "VITE_AURONA_CHANNEL=pioneer" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
            echo "AURONA_CHANNEL=stable" >> "$GITHUB_ENV"
            echo "VITE_AURONA_CHANNEL=stable" >> "$GITHUB_ENV"
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AURONA_ACCOUNT_CLIENT_ID: ${{ secrets.AURONA_ACCOUNT_CLIENT_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AURONA_CHANNEL: ${{ env.AURONA_CHANNEL }}
          VITE_AURONA_CHANNEL: ${{ env.VITE_AURONA_CHANNEL }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Aurona Code ${{ env.RELEASE_TAG }}
          assetNamePattern: AuronaCode-v[version]-[arch][setup][ext]
          args: ${{ matrix.settings.args }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}

      - name: Validate bundled macOS runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          RUNTIME="$(find src-tauri/target -path '*/Aurona Code.app/Contents/Resources/toolchains/runtime/node' -print -quit)"
          test -n "$RUNTIME"
          lipo "$RUNTIME" -verify_arch arm64 x86_64
          "$RUNTIME" --version

      - name: Validate Linux bundle and runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -n "$(find src-tauri/target -path '*/bundle/appimage/*.AppImage' -print -quit)"
          test -n "$(find src-tauri/target -path '*/bundle/deb/*.deb' -print -quit)"
          src-tauri/resources/toolchains/runtime/node --version

  sync-pioneer:
    name: Sync Pioneer Latest Channel
    needs: [preflight, release]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    if: contains(github.ref_name, '-pioneer.') || (github.event_name == 'workflow_dispatch' && contains(inputs.tag, '-pioneer.'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Sync assets to pioneer-latest release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          echo "Syncing Pioneer release $TAG to pioneer-latest channel..."
          mkdir -p /tmp/pioneer-assets
          gh release download "$TAG" --dir /tmp/pioneer-assets --pattern "*" || true

          if gh release view pioneer-latest >/dev/null 2>&1; then
            echo "Updating existing pioneer-latest release..."
            gh release upload pioneer-latest /tmp/pioneer-assets/* --clobber
            gh release edit pioneer-latest --title "Aurona Code Pioneer Latest ($TAG)" --notes "Latest pre-release track: $TAG" --prerelease=true
          else
            echo "Creating new pioneer-latest release..."
            gh release create pioneer-latest /tmp/pioneer-assets/* \
              --title "Aurona Code Pioneer Latest ($TAG)" \
              --notes "Latest pre-release track: $TAG" \
              --prerelease=true
          fi
