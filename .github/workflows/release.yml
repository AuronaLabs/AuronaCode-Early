name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.3.0
        required: true
        type: string
      upload_draft:
        description: Upload verified candidates to a draft release
        required: false
        default: false
        type: boolean
      publish_release:
        description: Publish verified draft after matching Quality and release scope checks
        required: false
        default: false
        type: boolean
      promote_pioneer:
        description: Promote verified Pioneer artifacts to the public channel
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate tag format
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

      - name: Require successful Quality for the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          SOURCE="$(git rev-parse HEAD)"
          gh run list --workflow quality.yml --commit "$SOURCE" --limit 20 --json conclusion,event --jq 'any(.[]; .conclusion == "success" and .event == "push")' | grep -qx true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup extension toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: wasm32-wasip2

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./Extensions/aurona.vscode-compat
          prefix-key: release-preflight

      - name: Verify release metadata
        run: |
          pnpm run smoke
          pnpm run check:audit
          pnpm run check:audit:release
          pnpm run test:release-contract

      - name: Verify source quality
        run: |
          pnpm run prepare:extensions
          pnpm run typecheck
          pnpm run check
          pnpm run i18n:check
          pnpm run check:boundaries
          pnpm run check:materials
          pnpm run test:frontend
          pnpm run build

      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v$PACKAGE_VERSION" && "$RELEASE_TAG" != "v$PACKAGE_VERSION"-* ]]; then
            echo "Tag $RELEASE_TAG does not match package version v$PACKAGE_VERSION"
            exit 1
          fi

  release:
    name: Build (${{ matrix.settings.platform }})
    needs: preflight
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: macos-latest
            args: --target universal-apple-darwin
            target: universal-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: --bundles nsis
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.settings.platform }}
    # release 构建使用 lto + codegen-units=1（Cargo.toml），且无法复用 quality 的
    # debug 编译缓存；Windows 冷编译 wasmtime 的 release 版本耗时极长，预留充足上限。
    timeout-minutes: 180
    env:
      TAURI_ENV_TARGET_TRIPLE: ${{ matrix.settings.target }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.settings.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin,wasm32-wasip2' || 'wasm32-wasip2' }}

      - name: Ensure wasm target is installed
        run: rustup target add wasm32-wasip2

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri
          # 与 quality 工作流的缓存 key 隔离，避免两个工作流并发时同 key 保存互相顶掉
          prefix-key: release
          # 即使构建失败也保留缓存，避免一次超时导致后续每次冷编译
          cache-on-failure: true

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
          pkg-config --modversion gdk-3.0

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch Cargo dependencies
        working-directory: src-tauri
        run: cargo fetch --locked

      - name: Extract changelog
        run: pnpm exec vite-node scripts/extract-changelog.ts
        env:
          GITHUB_REF_NAME: ${{ env.RELEASE_TAG }}

      - name: Detect release channel
        shell: bash
        run: |
          if [[ "${{ env.RELEASE_TAG }}" =~ -pioneer\. ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
            echo "AURONA_CHANNEL=pioneer" >> "$GITHUB_ENV"
            echo "VITE_AURONA_CHANNEL=pioneer" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
            echo "AURONA_CHANNEL=stable" >> "$GITHUB_ENV"
            echo "VITE_AURONA_CHANNEL=stable" >> "$GITHUB_ENV"
          fi

      - name: Verify bundled extensions
        run: pnpm run check:bundled-extensions

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AURONA_ACCOUNT_CLIENT_ID: ${{ secrets.AURONA_ACCOUNT_CLIENT_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AURONA_CHANNEL: ${{ env.AURONA_CHANNEL }}
          VITE_AURONA_CHANNEL: ${{ env.VITE_AURONA_CHANNEL }}
        with:
          assetNamePattern: AuronaCode-v[version]-[arch][setup][ext]
          # Pioneer 渠道 merge 覆盖更新端点（pioneer-latest 优先）；stable 保持主 conf 的 releases/latest
          args: ${{ matrix.settings.args }} ${{ env.AURONA_CHANNEL == 'pioneer' && '--config src-tauri/tauri.pioneer.conf.json' || '' }}
      - name: Generate and verify signed candidate metadata
        run: node scripts/prepare-built-candidate.mjs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AURONA_CANDIDATE_RELEASE: '1'
      - name: Retain candidate build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.settings.target }}
          path: |
            src-tauri/target/**/bundle/**
            candidate/**
          if-no-files-found: error

      - name: Validate bundled macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="$(find src-tauri/target -type d -name 'Aurona Code.app' -print -quit)"
          test -n "$APP"
          echo "Found bundled app: $APP"
          BIN="$(ls "$APP/Contents/MacOS" | head -n1)"
          lipo "$APP/Contents/MacOS/$BIN" -verify_arch arm64 x86_64
          echo "Verified universal binary: $BIN (arm64 + x86_64)"

      - name: Validate Linux bundle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -n "$(find src-tauri/target -path '*/bundle/appimage/*.AppImage' -print -quit)"
          test -n "$(find src-tauri/target -path '*/bundle/deb/*.deb' -print -quit)"

  upload-draft:
    name: Upload reviewed candidates
    needs: [preflight, release]
    if: github.event_name == 'workflow_dispatch' && inputs.upload_draft
    environment: release-review
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:audit:release
      - name: Extract release notes
        run: pnpm exec vite-node scripts/extract-changelog.ts
        env:
          GITHUB_REF_NAME: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: candidate-assets
      - name: Install verifier runtime dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri
          prefix-key: candidate-verifier
      - name: Build verifier from trusted repository source
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --example verify_candidate
      - name: Verify candidates and aggregate signed updater manifests
        run: node scripts/merge-candidates.mjs candidate-assets
      - name: Upload draft artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find candidate-assets -path '*/src-tauri/target/*' -prune -o -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.tar.gz' -o -name '*.exe.sig' -o -name '*.dmg.sig' -o -name '*.deb.sig' -o -name '*.AppImage.sig' -o -name '*.tar.gz.sig' \) -print0)
          test "${#assets[@]}" -gt 0
          mapfile -d '' metadata < <(find candidate-assets -maxdepth 1 -type f -name 'release-metadata.*' -print0)
          test "${#metadata[@]}" -gt 0
          gh release create "$RELEASE_TAG" "${assets[@]}" "${metadata[@]}" candidate-assets/latest.json candidate-assets/SHA256SUMS --draft --verify-tag --title "Aurona Code $RELEASE_TAG" --notes-file RELEASE_BODY.md

  publish:
    name: Publish verified release
    needs: [preflight, release, upload-draft]
    if: github.event_name == 'workflow_dispatch' && inputs.upload_draft && inputs.publish_release
    environment: release-promotion
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          if [[ "$RELEASE_TAG" == *-pioneer.* ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=true --latest=false
          else
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest=true
          fi

  sync-pioneer:
    name: Sync Pioneer Latest Channel
    needs: [preflight, release, upload-draft]
    environment: release-promotion
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' && inputs.upload_draft && inputs.promote_pioneer && contains(inputs.tag, '-pioneer.')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Sync assets to pioneer-latest release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          REPO="${{ github.repository }}"
          echo "Syncing Pioneer release $TAG to pioneer-latest channel..."
          mkdir -p /tmp/pioneer-assets
          gh release download "$TAG" --repo "$REPO" --dir /tmp/pioneer-assets --pattern "*"

          if [[ -z "$(ls -A /tmp/pioneer-assets 2>/dev/null)" ]]; then
            echo "No assets were downloaded from release $TAG — aborting sync."
            exit 1
          fi

          # The tag release is created as a draft by tauri-action, so its asset
          # URLs stay 404 until it is reviewed and published. Rewrite the
          # updater manifests to point at the public pioneer-latest assets,
          # which are uploaded right below, so the update channel never
          # depends on the draft being published.
          for f in /tmp/pioneer-assets/latest*.json; do
            [[ -f "$f" ]] || continue
            sed -i "s|releases/download/$TAG/|releases/download/pioneer-latest/|g" "$f"
            echo "Rewrote updater URLs in $(basename "$f")"
          done

          if gh release view pioneer-latest --repo "$REPO" >/dev/null 2>&1; then
            echo "Updating existing pioneer-latest release..."
            gh release upload pioneer-latest --repo "$REPO" /tmp/pioneer-assets/* --clobber
            gh release edit pioneer-latest --repo "$REPO" \
              --title "Aurona Code Pioneer Latest ($TAG)" \
              --notes "Latest pre-release track: $TAG" \
              --prerelease=true
          else
            echo "Creating new pioneer-latest release..."
            gh release create pioneer-latest --repo "$REPO" /tmp/pioneer-assets/* \
              --title "Aurona Code Pioneer Latest ($TAG)" \
              --notes "Latest pre-release track: $TAG" \
              --prerelease=true
          fi

          echo "Sync complete. Updater manifest now points at public pioneer-latest assets."
