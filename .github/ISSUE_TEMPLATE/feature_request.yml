name: 改进建议
description: 描述具体使用场景、现有问题和可验收的改进
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请围绕实际工作流程描述建议，并说明预期收益与最小可行范围。
        建议进入讨论不代表已纳入版本计划；涉及较大范围的调整，需进一步明确依赖与兼容性。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与现有问题
      description: 正在完成什么任务，当前流程有哪些具体限制？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 希望如何改进，使用者将看到什么变化？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方式
      description: 说明现有能力、配置或其他工作方式为何不足以解决问题。
  - type: textarea
    id: context
    attributes:
      label: 兼容性与补充资料
      description: 可补充平台、扩展、快捷键、安全选项等影响，或提供脱敏示意图。
  - type: textarea
    id: acceptance
    attributes:
      label: 最小可验收结果
      description: 最小版本需要完成哪些行为，如何确认问题得到解决？
    validations:
      required: true
