name: 缺陷报告
description: 提供可复现的问题与必要环境信息
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        请描述实际行为与复现步骤。涉及安全漏洞时，请使用安全策略中的私密报告渠道。
        日志、截图和示例项目请先移除凭据、私有代码及个人信息。
  - type: textarea
    id: description
    attributes:
      label: 实际行为
      description: 问题发生在哪里，观察到什么结果，是否影响文件或会话数据？
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 从应用启动或打开项目开始，提供尽可能少的操作步骤。
      placeholder: |
        1. 使用指定构建打开示例项目。
        2. 执行触发问题的操作。
        3. 记录实际结果与错误提示。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 在相同操作下，期望应用如何处理？
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本与提交
      description: 填写应用版本；开发构建请同时提供分支及 commit。
      placeholder: 0.4.18；或其他版本与 commit
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: 运行方式
      description: 纯前端预览不提供原生文件、Git、终端等桌面能力。
      options:
        - Release 安装包
        - tauri:dev 桌面开发环境
        - 前端浏览器预览
        - 不确定
    validations:
      required: true
  - type: input
    id: scale
    attributes:
      label: 系统架构与显示缩放
      description: 请提供系统版本、架构；视觉问题同时提供显示缩放。
      placeholder: Windows 11 / x64 / 125%
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 相关配置与环境
      description: 按需说明主题、材质、扩展 ID 与版本、安全开关、Shell 或 Git 版本。请勿填写密钥。
  - type: textarea
    id: logs
    attributes:
      label: 日志与界面证据
      description: 提供脱敏日志、截图或最小示例；如已确认仅在特定版本出现，可说明对照结果。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，并确认没有相同问题
          required: true
        - label: 我已移除日志和截图中的密钥、私人路径与敏感代码
          required: true
